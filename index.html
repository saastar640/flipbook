<!doctype html>
<html>
<head>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #212121;
  overflow: hidden;
}

/* Book wrapper */
#book {
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>

<body>

<div id="book"></div>

<script src="page-flip.browser.js"></script>
<script>
const BOOK_RATIO = 950 / 1250;
const PAGES = [
  "pages/1.jpg","pages/2.jpg","pages/3.jpg","pages/4.jpg","pages/5.jpg",
  "pages/6.jpg","pages/7.jpg","pages/8.jpg","pages/9.jpg","pages/10.jpg",
  "pages/11.jpg","pages/12.jpg","pages/13.jpg","pages/14.jpg","pages/15.jpg",
  "pages/16.jpg","pages/17.jpg","pages/18.jpg","pages/19.jpg","pages/20.jpg",
  "pages/21.jpg","pages/22.jpg","pages/23.jpg","pages/24.jpg","pages/25.jpg",
  "pages/26.jpg","pages/27.jpg","pages/28.jpg","pages/29.jpg","pages/30.jpg",
  "pages/31.jpg","pages/32.jpg","pages/33.jpg","pages/34.jpg","pages/35.jpg",
  "pages/36.jpg"
];

const bookEl = document.getElementById("book");

function isDesktop() {
  return window.matchMedia("(min-width: 1024px)").matches;
}

function getBookSize() {
  const maxWidth = 950;

  let width = Math.min(maxWidth, window.innerWidth * 0.92);
  let height = width / BOOK_RATIO;

  if (height > window.innerHeight * 0.9) {
    height = window.innerHeight * 0.9;
    width = height * BOOK_RATIO;
  }

  return { width: Math.round(width), height: Math.round(height) };
}

let pageFlip = null;
let lastPortraitMode = null;

function createFlipbook(portraitMode) {
  // Clean old DOM
  bookEl.innerHTML = "";

  const size = getBookSize();

  pageFlip = new St.PageFlip(bookEl, {
    width: size.width,
    height: size.height,
    autoSize: false,
    showCover: true,
    usePortrait: portraitMode // mobile=true single, desktop=false double
  });

  pageFlip.loadFromImages(PAGES);
  lastPortraitMode = portraitMode;
}

function refreshFlipbook() {
  const portraitMode = !isDesktop(); // desktop = double (false), mobile = single (true)

  // First time
  if (!pageFlip) {
    createFlipbook(portraitMode);
    return;
  }

  // If mode changed (single <-> double), MUST recreate
  if (portraitMode !== lastPortraitMode) {
    try { pageFlip.destroy(); } catch (e) {}
    pageFlip = null;
    createFlipbook(portraitMode);
    return;
  }

  // Mode same: just resize safely
  const size = getBookSize();
  pageFlip.update(size); // ✅ only size object
}

// Resize without spamming
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(refreshFlipbook, 150);
});

refreshFlipbook();
</script>


</body>
</html>
